[project]
name = "speechlab"
version = "0.1.0"
description = "Evaluation lab for L2 English spoken-response scoring (Speak & Improve Corpus 2025)"
requires-python = ">=3.12"
# Runtime dependencies are pinned in requirements.txt; the package itself stays
# declaration-light so `uv pip install -e .` never fights the notebook environment.
dependencies = []

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
